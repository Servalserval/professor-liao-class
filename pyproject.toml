[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pmopt"
version = "0.1.0"
description = "用期權隱含機率檢查 Polymarket 加密貨幣價格盤的定價（課堂示範）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "requests>=2.28",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pmopt = "pmopt.__main__:main"

[tool.setuptools]
packages = ["pmopt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
